name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Do not set "base" or "head". Without them, the action scans the
      # commits of the push or pull request event. On a push to main,
      # "base: main" and "head: HEAD" are the same commit, and the scan fails.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          extra_args: --debug --only-verified

  devskim:
    name: Static security analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DevSkim
        uses: microsoft/DevSkim-Action@v1

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif

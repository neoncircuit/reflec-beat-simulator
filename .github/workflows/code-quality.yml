name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter/slim@v9
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # Set only "true" values. Super-linter stops with an error if some
          # VALIDATE_* values are "true" and others are "false". Languages
          # that are not set here (C# too) are not linted.
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
